[project]
name = "cursoradar-monorepo"
version = "0.1.0"
description = "CursoRadar - Plataforma Multi-Usuário de Vagas e Bolsas (Monorepo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "sqlalchemy>=2.0.36",
    "apscheduler>=3.10.4",
    "python-telegram-bot>=21.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/monitor/tests"]
pythonpath = ["services/monitor"]

